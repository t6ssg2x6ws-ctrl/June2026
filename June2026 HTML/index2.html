<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Fuel Station Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .main-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            background: #ffffff;
        }
        .form-label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            border: 1px solid #d1d5db;
        }
        .form-control:focus, .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .fuel-table-container {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }
        .fuel-badge {
            font-size: 0.8rem;
            padding: 0.4em 0.7em;
            border-radius: 6px;
            font-weight: 600;
        }
        .table-custom {
            border-radius: 12px;
            overflow: hidden;
            background: white;
        }
        .table-custom thead th {
            font-weight: 700;
            color: #111827;
            border-bottom: 2px solid #e5e7eb;
            padding: 1rem;
        }
        .table-custom td {
            padding: 1rem;
            vertical-align: middle;
        }
        .action-btn {
            border-radius: 8px;
            font-weight: 600;
            padding: 0.35rem 0.85rem;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <div class="container my-5">
        <!-- Form Card UI -->
        <div class="card main-card mb-5">
            <div class="card-body p-4">
                <form id="fuelForm">
                    <!-- Row 1: Car No & License -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="carNo" class="form-label">Car No</label>
                            <input type="text" class="form-control" id="carNo" name="carNo" placeholder="Enter car number">
                        </div>

                        <div class="col-md-6">
                            <label for="license" class="form-label">Driver's License Number</label>
                            <div class="input-group">
                                <select class="form-select" id="licenseRegion" style="max-width: 110px;">
                                    <option value="1A">1A</option>
                                    <option value="2B">2B</option>
                                    <option value="3C">3C</option>
                                    <option value="4D">4D</option>
                                    <option value="YGN">YGN</option>
                                    <option value="MDY">MDY</option>
                                    <option value="BGO">BGO</option>
                                </select>
                                <input type="text" class="form-control" id="license" name="license" placeholder="1A-FDSA">
                            </div>
                        </div>
                    </div>

                    <!-- Row 2: SWITCHED PLACES - Region FIRST, Shop Name SECOND -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="region" class="form-label">Region</label>
                            <select class="form-select" id="region" name="region">
                                <option value="" selected disabled>-- Select Region --</option>
                                <option value="YGN">YGN</option>
                                <option value="MDY">MDY</option>
                                <option value="BGO">BGO</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="shopName" class="form-label">Shop Name</label>
                            <select class="form-select" id="shopName" name="shopName" disabled>
                                <option value="" selected disabled>-- Select Region First --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 3: Petroleum Available Amounts Grid -->
                    <div class="mb-4">
                        <label for="petroleum" class="form-label fw-bold">Petroleum Available Amounts (Liters)</label>
                        <input type="hidden" class="form-control" id="petroleum" name="petroleum">
                        
                        <div class="fuel-table-container">
                            <table class="table align-middle mb-0 bg-white">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 35%;">Fuel Type</th>
                                        <th>Available Amount (Liters)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td><span class="badge bg-success fuel-badge me-2">Octane 92</span> Octane 92</td>
                                        <td>
                                            <input type="number" class="form-control fuel-amount" id="octane92" min="0" step="any" placeholder="0.00">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td><span class="badge bg-info text-dark fuel-badge me-2">Octane 95</span> Octane 95</td>
                                        <td>
                                            <input type="number" class="form-control fuel-amount" id="octane95" min="0" step="any" placeholder="0.00">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td><span class="badge bg-secondary fuel-badge me-2">Diesel</span> Diesel</td>
                                        <td>
                                            <input type="number" class="form-control fuel-amount" id="diesel" min="0" step="any" placeholder="0.00">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td><span class="badge bg-warning text-dark fuel-badge me-2">Premium Diesel</span> Premium Diesel</td>
                                        <td>
                                            <input type="number" class="form-control fuel-amount" id="premiumDiesel" min="0" step="any" placeholder="0.00">
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <div class="d-flex justify-content-start">
                        <button type="button" class="btn btn-success px-4 py-2 fw-semibold" id="Success">Success</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Directory Table Card UI (Matching Screenshot Exactly) -->
        <div class="card main-card">
            <div class="card-body p-4">
                <h4 class="fw-bold mb-4 text-dark">Fuel Station Directory Records</h4>
                
                <div class="table-responsive">
                    <table class="table align-middle mb-0 table-custom">
                        <thead>
                            <tr>
                                <th scope="col" style="width: 100px;">Actions</th>
                                <th scope="col" style="width: 50px;">#</th>
                                <th scope="col" style="width: 250px;">ID</th>
                                <th scope="col">Car Number</th>
                                <th scope="col">Petroleum</th>
                                <th scope="col">Shop Name</th>
                                <th scope="col">Region</th>
                                <th scope="col">License</th>
                            </tr>
                        </thead>
                        <tbody id="TableData">
                            <!-- Dynamic Rows Rendered Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        const stationMap = {
            'YGN': ['Max Energy', 'Denko', 'Regency'],
            'MDY': ['New Day', 'BOC', 'Apex Petroleum'],
            'BGO': ['PT Power BGO', 'Shwe Taung', 'Denko BGO']
        };

        let _editID = null;

        $(document).ready(function () {
            loaddata();

            // Dynamic Dropdown Filter (Region -> Shop Name)
            $('#region').change(function () {
                let selectedRegion = $(this).val();
                let $shopName = $('#shopName');
                $shopName.empty();

                if (selectedRegion && stationMap[selectedRegion]) {
                    $shopName.append('<option value="" selected disabled>-- Select Station --</option>');
                    $.each(stationMap[selectedRegion], function (i, station) {
                        $shopName.append('<option value="' + station + '">' + station + '</option>');
                    });
                    $shopName.prop('disabled', false);
                } else {
                    $shopName.append('<option value="" selected disabled>-- Select Region First --</option>');
                    $shopName.prop('disabled', true);
                }
            });

            // Prevent Negative Numeric Values
            $('.fuel-amount').on('input change', function () {
                let val = parseFloat($(this).val());
                if (val < 0) {
                    $(this).val(0);
                }
            });
        });

        $('#Success').click(function () {
            if (_editID == null) {
                Savedata();
            } else {
                Updatedata();
                _editID = null;
            }
        });

        function buildPetroleumSummary() {
            let oct92 = $('#octane92').val() || '0';
            let oct95 = $('#octane95').val() || '0';
            let diesel = $('#diesel').val() || '0';
            let pDiesel = $('#premiumDiesel').val() || '0';
            let summary = `92: ${oct92}L | 95: ${oct95}L | D: ${diesel}L | PD: ${pDiesel}L`;
            $('#petroleum').val(summary);
            return summary;
        }

        function parsePetroleumSummary(petrolStr) {
            if (!petrolStr) return;
            let parts = petrolStr.split('|');
            parts.forEach(function (part) {
                let sub = part.trim().split(':');
                if (sub.length === 2) {
                    let key = sub[0].trim();
                    let val = parseFloat(sub[1].replace('L', '').trim()) || 0;
                    if (key === '92') $('#octane92').val(val);
                    if (key === '95') $('#octane95').val(val);
                    if (key === 'D') $('#diesel').val(val);
                    if (key === 'PD') $('#premiumDiesel').val(val);
                }
            });
        }

        function getFullLicense() {
            let prefix = $('#licenseRegion').val();
            let num = $('#license').val().trim();
            if (!num) return '';
            return num.includes('-') ? num : `${prefix}-${num}`;
        }

        function clearInputs() {
            $('#carNo').val('');
            $('#license').val('');
            $('#region').val('').trigger('change');
            $('#shopName').val('').prop('disabled', true);
            $('.fuel-amount').val('');
            $('#petroleum').val('');
        }

        function Savedata() {
            let Car_Number = $('#carNo').val();
            let Petroleum = buildPetroleumSummary();
            let Shop_Name = $('#shopName').val();
            let Region = $('#region').val();
            let License = getFullLicense();

            let dataput = {
                id: crypto.randomUUID(),
                CarNO: Car_Number,
                Petrol: Petroleum,
                shop: Shop_Name,
                region: Region,
                license: License
            };
            let dataputs = [];
            let jsoncon = localStorage.getItem("dataputs");
            if (jsoncon != null) {
                dataputs = JSON.parse(jsoncon);
            }
            dataputs.push(dataput);
            let jscon = JSON.stringify(dataputs);
            localStorage.setItem("dataputs", jscon);

            clearInputs();
            loaddata();
        }

        function Updatedata() {
            let _CarNO = $('#carNo').val();
            let _Petrol = buildPetroleumSummary();
            let _Shop = $('#shopName').val();
            let _Region = $('#region').val();
            let _License = getFullLicense();

            let get_data = localStorage.getItem("dataputs");

            let dataputs = [];
            if (get_data != null) {
                dataputs = JSON.parse(get_data);
            }

            let index = dataputs.findIndex(x => x.id == _editID);
            if (index == -1) {
                alert("No Data Found!");
                return;
            }

            dataputs[index].CarNO = _CarNO;
            dataputs[index].Petrol = _Petrol;
            dataputs[index].shop = _Shop;
            dataputs[index].region = _Region;
            dataputs[index].license = _License;

            let JsonCon = JSON.stringify(dataputs);
            localStorage.setItem("dataputs", JsonCon);

            clearInputs();
            loaddata();
        }

        function loaddata() {
            $('#TableData').html(' ');
            let dataputs = [];
            let get_data = localStorage.getItem("dataputs");

            if (get_data != null) {
                dataputs = JSON.parse(get_data);
            }
            for (let i = 0; i < dataputs.length; i++) {
                const dataput = dataputs[i];
                let TbRow = `
                                <tr>
                                    <td>
                                        <div class="d-flex flex-column gap-1" style="width: 75px;">
                                            <a class="btn btn-primary action-btn" href="#" role="button" onclick = "EditData('${dataput.id}')">Edit</a>
                                            <button class="btn btn-primary action-btn" type="submit" onclick = "Delete('${dataput.id}')" >Delete</button>
                                        </div>
                                    </td>
                                    <th scope="row">${i + 1}</th>
                                    <td style="word-break: break-all;">${dataput.id}</td>
                                    <td>${dataput.CarNO}</td>
                                    <td>${dataput.Petrol} </td>
                                    <td>${dataput.shop} </td>
                                    <td>${dataput.region} </td>
                                    <td>${dataput.license} </td>
                                </tr>
                            `;
                $('#TableData').append(TbRow);
            }
        }

        function EditData(id) {
            let get_Data = localStorage.getItem("dataputs");
            let dataputs = [];
            if (get_Data != null) {
                dataputs = JSON.parse(get_Data);
            }
            let filter = dataputs.filter(x => x.id == id);
            if (filter.length == 0) {
                return;
            }
            let dataput = filter[0];
            $('#carNo').val(dataput.CarNO);
            $('#region').val(dataput.region).trigger('change');
            $('#shopName').val(dataput.shop);

            if (dataput.license && dataput.license.includes('-')) {
                let parts = dataput.license.split('-');
                $('#licenseRegion').val(parts[0]);
                $('#license').val(parts[1]);
            } else {
                $('#license').val(dataput.license);
            }

            parsePetroleumSummary(dataput.Petrol);

            _editID = id;
        }

        function Delete(id) {
            let get_data = localStorage.getItem("dataputs");
            let dataputs = [];

            if (get_data != null) {
                dataputs = JSON.parse(get_data);
            }

            let index = dataputs.findIndex(x => x.id == id);
            if (index == -1) {
                return;
            }

            let exxludenum = dataputs.filter(x => x.id != id);

            let _jsonstr = JSON.stringify(exxludenum);
            localStorage.setItem("dataputs", _jsonstr);

            loaddata();
        }
    </script>
</body>

</html>
